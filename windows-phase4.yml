name: Windows Phase 4 evidence
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
 verify:
  runs-on: windows-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: '10.0.x' }
   - name: Run Phase 4 build and core tests
     shell: pwsh
     run: ./eng/phase4-windows.ps1
   - name: Upload evidence even on failure
     if: always()
     uses: actions/upload-artifact@v4
     with: { name: phase4-evidence, path: evidence/**, if-no-files-found: warn }
   - name: Upload MSIX output
     if: success()
     uses: actions/upload-artifact@v4
     with: { name: SmartOrganizer-development-msix, path: '**/AppPackages/**' }
